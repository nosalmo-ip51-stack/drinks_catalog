<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Каталог рецептів напоїв (Vue 3)</title>
    <link rel="stylesheet" href="css/style.css" />

    <!-- Підключення клієнтського фреймворку Vue 3 через CDN -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

    <script src="script.js" defer></script>
  </head>
  <body>
    <header>
      <div class="header-content">
        <h1>Каталог рецептів напоїв</h1>
        <nav>
          <a href="#">Гарячі напої</a>
          <a href="#">Холодні напої</a>
          <a href="#">Коктейлі</a>
        </nav>
      </div>
    </header>

    <div class="layout-container">
      <main>
        <!-- Блок пошуку -->
        <section id="filter">
          <h2>Фільтр рецептів</h2>
          <p>Пошук за інгредієнтом:</p>
          <input type="text" placeholder="Наприклад: м'ята" />
        </section>

        <!-- Кореневий елемент Vue -->
        <section id="app" class="recipes-section">
          <h2>Популярні рецепти (Декларативний рендер Vue 3)</h2>

          <!-- Чекбокс для фільтрації -->
          <div
            class="filter-container"
            style="
              margin-bottom: 20px;
              background: #fff;
              padding: 15px;
              border-radius: 8px;
              border: 1px solid #ddd;
              max-width: 400px;
            "
          >
            <label style="cursor: pointer; font-weight: bold; font-size: 16px">
              <input
                type="checkbox"
                v-model="showOnlyNonAlcoholic"
                style="transform: scale(1.2); margin-right: 8px"
              />
              Лише безалкогольні
            </label>
          </div>

          <p
            id="drinks-count"
            style="margin-bottom: 15px; font-weight: bold; color: #555"
          >
            Кількість знайдених рецептів: {{ filteredDrinks.length }}
          </p>

          <!-- Контейнер для карток -->
          <div id="drinks-list" class="cards">
            <drink-card
              v-for="drink in filteredDrinks"
              :key="drink.id"
              :name="drink.name"
              :type="drink.type"
              :time-minutes="drink.timeMinutes"
              :alcohol="drink.alcohol"
              :image="drink.image"
            >
            </drink-card>
          </div>

          <!-- Форма додавання рецепта -->
          <div
            class="form-container"
            style="
              margin-top: 40px;
              max-width: 500px;
              background: #fff;
              padding: 20px;
              border-radius: 8px;
              border: 1px solid #ddd;
            "
          >
            <h3>Додати новий рецепт</h3>
            <form id="add-recipe-form">
              <div style="margin-bottom: 10px">
                <label for="recipe-name">Назва рецепта:</label><br />
                <input
                  type="text"
                  id="recipe-name"
                  name="name"
                  style="width: 100%; padding: 8px; margin-top: 4px"
                />
              </div>
              <div style="margin-bottom: 10px">
                <label for="recipe-type">Тип напою:</label><br />
                <select
                  id="recipe-type"
                  name="type"
                  style="width: 100%; padding: 8px; margin-top: 4px"
                >
                  <option value="Гарячі напої">Гарячі напої</option>
                  <option value="Коктейлі">Коктейлі</option>
                </select>
              </div>
              <div style="margin-bottom: 10px">
                <label for="recipe-time">Час приготування (хв):</label><br />
                <input
                  type="number"
                  id="recipe-time"
                  name="timeMinutes"
                  style="width: 100%; padding: 8px; margin-top: 4px"
                />
              </div>
              <div style="margin-bottom: 15px">
                <label>
                  <input type="checkbox" id="recipe-alcohol" name="alcohol" />
                  Містить алкоголь
                </label>
              </div>
              <button
                type="submit"
                style="
                  padding: 10px 20px;
                  background: #8b0000;
                  color: white;
                  border: none;
                  border-radius: 4px;
                  cursor: pointer;
                "
              >
                Додати рецепт
              </button>
            </form>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
